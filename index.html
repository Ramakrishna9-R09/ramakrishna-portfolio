    <script>
      (function () {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        var shouldStartAtHero = !location.hash || location.hash === '#hero';
        if (!shouldStartAtHero) return;

        function resetScroll() {
          scrollTo(0, 0);
        }

        resetScroll();
        addEventListener('pageshow', resetScroll);
        addEventListener('DOMContentLoaded', resetScroll);
        addEventListener('load', resetScroll);
        [0, 50, 150, 400, 900, 1500].forEach(function (delay) {
          setTimeout(resetScroll, delay);
        });
      })();
    </script>
